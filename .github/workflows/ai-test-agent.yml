name: AI TEST AGENT

on:
  push:
    branches: [main]
    paths:
      - "src/main/java/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run tests
        run: mvn test